<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Taller AgroTendencias</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#163a24">
  <meta name="description" content="Taller y almacén de Agro Tendencias">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Taller AT">
  <style>
    html, body { margin: 0; height: 100%; background: #163a24; overflow: hidden; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #f3ede1;
      padding-top: env(safe-area-inset-top); box-sizing: border-box; opacity: 0; transition: opacity .25s; }
    #app.listo { opacity: 1; }
    #splash, #sinred { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; color: #f3ede1; font: 600 16px/1.4 Georgia, 'Times New Roman', serif; text-align: center; padding: 24px; }
    #splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
    .barra { width: 140px; height: 4px; border-radius: 4px; background: rgba(243,237,225,.18); overflow: hidden; }
    .barra::after { content: ''; display: block; width: 40%; height: 100%; background: #e8a325; border-radius: 4px; animation: ir 1.1s ease-in-out infinite; }
    @keyframes ir { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    #sinred { display: none; background: #163a24; }
    #sinred button { font: inherit; border: 0; border-radius: 12px; padding: 12px 22px; background: #e8a325; color: #163a24; cursor: pointer; }
    small { opacity: .7; font-weight: 400; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icono-192.png" alt="">
    <div>Taller AgroTendencias</div>
    <div class="barra"></div>
  </div>
  <div id="sinred">
    <img src="icono-192.png" alt="" style="width:72px;height:72px;border-radius:18px">
    <div>Sin conexión a internet</div>
    <small>El sistema necesita internet para abrir. Revisa la conexión e intenta de nuevo.</small>
    <button onclick="location.reload()">Intentar de nuevo</button>
  </div>
  <iframe id="app" title="Taller AgroTendencias" allow="clipboard-read; clipboard-write; camera; fullscreen; geolocation"></iframe>
  <script>
    /* ===== ÚNICO DATO A CAMBIAR: la dirección /exec de tu implementación de Apps Script ===== */
    const URL_SISTEMA = 'https://script.google.com/macros/s/AKfycbw4_1mwUBt7rptyh0BGmn0WG4XngJURkog9wnEsrF0uEB6g_W2ghNkqdFxi91OOfgTfUQ/exec';

    const app = document.getElementById('app');
    function abrir() {
      if (!navigator.onLine) { document.getElementById('splash').style.display = 'none'; document.getElementById('sinred').style.display = 'flex'; return; }
      app.onload = () => { app.classList.add('listo'); setTimeout(() => document.getElementById('splash').style.display = 'none', 250); };
      app.src = URL_SISTEMA;
    }
    window.addEventListener('online', () => { if (!app.src) location.reload(); });
    abrir();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
